<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Cat - Pet Rescue & Rehoming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">🐱 Pet Rescue & Rehoming</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="upload.html" class="active">Upload Cat</a></li>
                <li><a href="gallery.html">Gallery</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="upload-section">
            <h2>Upload a Cat</h2>
            <form id="upload-form" class="upload-form">
                <div class="form-group">
                    <label for="image">Cat Image *</label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                    <div id="image-preview" class="image-preview"></div>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="">Select status</option>
                        <option value="lost">Lost</option>
                        <option value="found">Found</option>
                        <option value="stray">Stray</option>
                        <option value="adoptable">Adoptable</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Downtown Park, New York" required>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" rows="4" placeholder="Describe the cat (color, markings, size, etc.)" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Upload Cat</button>
            </form>
            <div id="upload-message" class="message"></div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        // Setup upload form
        document.addEventListener('DOMContentLoaded', setupUploadForm);
    </script>
</body>
</html>
